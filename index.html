<head>

<title>Bogatyrev Marketing Team</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;

    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

  .links a {
    display: block;
    padding: 16px 20px;
    background: #f7f7f7;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    color: #1a1a1a;
    text-decoration: none;
    font-weight: 500;
    transition: background 0.15s;
  }
  .links a:hover { background: #efefef; }
  .contact { font-size: 14px; color: #666; padding-top: 24px; border-top: 1px solid #e5e5e5; }
  .contact strong { color: #1a1a1a; }
  .contact a { color: #2563eb; text-decoration: none; }
