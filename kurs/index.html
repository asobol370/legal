<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b0b;color:#ece7e2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;padding:22px 16px 90px;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto}
.gold{color:#b18268}.muted{color:#8d857d}.small{font-size:13px}
a{color:#b18268;text-decoration:none}
h1{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}

.banner{border-radius:16px;overflow:hidden;margin-bottom:16px;border:1px solid #292420;line-height:0}
.banner img{width:100%;height:auto;display:block}
.lead{color:#8d857d;font-size:14px;margin-bottom:2px}

/* ---------- пошук ---------- */
.searchbox{position:sticky;top:0;z-index:50;background:#0b0b0b;padding:14px 0 12px;margin-bottom:6px}
.sw{position:relative}
#q{width:100%;background:#151312;border:2px solid #302a25;border-radius:14px;color:#ece7e2;padding:16px 46px 16px 18px;font-size:16px;font-family:inherit}
#q:focus{outline:none;border-color:#b18268}
#q::placeholder{color:#5c554e}
.clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#6f675f;font-size:22px;cursor:pointer;padding:4px 8px;display:none}
.clr.on{display:block}
.hints{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.hint{background:#151312;border:1px solid #2b2622;color:#8d857d;font-size:11.5px;padding:4px 9px;border-radius:7px;cursor:pointer;line-height:1.4}
.hint:hover{border-color:#b18268;color:#b18268}

/* ---------- результати ---------- */
.res{margin-bottom:22px}
.res.off{display:none}
.rcount{font-size:13px;color:#8d857d;margin-bottom:10px}
.hit{background:#151312;border:1px solid #292420;border-left:3px solid #b18268;border-radius:12px;padding:16px 18px;margin-bottom:9px}
.hit .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hit .num{font-size:12px;font-weight:800;color:#b18268;background:#1e1712;padding:2px 8px;border-radius:6px}
.hit .ttl{font-size:16px;font-weight:700;flex:1;min-width:200px}
.hit .mod{font-size:11.5px;color:#6f675f}
.hit .why{font-size:12.5px;color:#6f675f;margin-top:5px}
.nores{background:#1d1712;border:1px solid #584029;border-radius:12px;padding:18px;color:#d4b9a3;font-size:14.5px;line-height:1.6}

/* ---------- чіпи-посилання ---------- */
.links{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.lk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:7px 12px;border-radius:9px;border:1px solid;white-space:nowrap}
.lk-v{background:#1e1212;border-color:#5c2b2b;color:#e88}
.lk-g{background:#141822;border-color:#2b3a56;color:#7fb3e8}
.lk-p{background:#121b15;border-color:#2c4a35;color:#8fd0a4}
.lk-t{background:#1e1712;border-color:#5a4433;color:#b18268}
.lk:hover{filter:brightness(1.25)}
.miss{background:#131110;border:1px dashed #332c26;color:#5c554e;font-size:12px;padding:7px 12px;border-radius:9px}

/* ---------- папки ---------- */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.fold{background:#151312;border:1px solid #292420;border-radius:14px;padding:18px;cursor:pointer;transition:border-color .18s,transform .18s}
.fold:hover{border-color:#b18268;transform:translateY(-2px)}
.fold .ic{display:block;margin-bottom:11px;line-height:0}
.fold .ic svg,.hic svg{fill:none;stroke:#b18268;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fold .ic svg{width:27px;height:27px}
.hic{display:inline-block;vertical-align:-4px;line-height:0;margin-right:3px}
.hic svg{width:20px;height:20px}
.fold:hover .ic svg{stroke:#d0a086}
.fold{position:relative}
.fold .win{position:absolute;right:12px;top:12px;height:60px;width:auto;pointer-events:none;
           filter:drop-shadow(0 3px 8px #000a)}
.modone{display:flex;align-items:center;gap:16px;background:#1e1712;border:1px solid #5a4433;
        border-radius:14px;padding:14px 18px;margin-top:12px}
.modone img{height:80px;width:auto;display:block;animation:hop 1.1s ease-in-out infinite}
.modone b{display:block;font-size:17px;color:#b18268}
.modone span{font-size:13.5px;color:#8d857d}

/* не-модульні плитки: заливка кольором банера, іконка й текст — темні */
.fold.alt{background:#b18268;border-color:#b18268}
.fold.alt:hover{background:#c08e70;border-color:#c08e70}
.fold.alt .mn{color:rgba(11,11,11,.55)}
.fold.alt .tt{color:#0b0b0b}
.fold.alt .cnt{color:rgba(11,11,11,.72)}
.fold.alt .ic svg,.fold.alt:hover .ic svg{stroke:#0b0b0b}
.fold .mn{font-size:11px;letter-spacing:.14em;color:#6f675f;text-transform:uppercase}
.fold .tt{font-size:16px;font-weight:700;margin:3px 0 9px;line-height:1.3}
.fold .cnt{font-size:12.5px;color:#8d857d}
.fold .fp{height:4px;background:#221e1a;border-radius:99px;margin-top:11px;overflow:hidden}
.fold .fp i{display:block;height:100%;background:#b18268;transition:width .4s}
.fold.full{border-color:#2c4a35}
.fold.full .fp i{background:#5aa96f}
.f{background:#151312;border:1px solid #2b2622;color:#8d857d;font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer}
.back{display:inline-flex;align-items:center;gap:7px;background:#151312;border:1px solid #2b2622;color:#cdc5bd;font-size:13.5px;padding:9px 15px;border-radius:9px;cursor:pointer;margin-bottom:16px}
.back:hover{border-color:#b18268;color:#b18268}

.mod{margin-bottom:26px}
.mhd{display:flex;align-items:baseline;gap:11px;margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid #221e1a}
.mhd b{font-size:18px;font-weight:800}
.mhd .c{font-size:12.5px;color:#6f675f;margin-left:auto}

.les{background:#151312;border:1px solid #292420;border-radius:12px;padding:14px 16px;margin-bottom:8px;transition:border-color .15s}
.les:hover{border-color:#3d352e}
.les.seen{opacity:.55}
.chk.off{border-style:dashed;cursor:default;opacity:.4}
.les.wait{opacity:.75}
.lhd{display:flex;gap:11px;align-items:flex-start}
.chk{flex:0 0 20px;height:20px;border-radius:6px;border:2px solid #3d352e;cursor:pointer;margin-top:2px;position:relative;transition:.15s}
.chk:hover{border-color:#6f675f}
.les.seen .chk{background:#5aa96f;border-color:#5aa96f}
.les.seen .chk::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #0b0b0b;border-width:0 2px 2px 0;transform:rotate(42deg)}
.lnum{font-size:12px;font-weight:800;color:#b18268;background:#1e1712;padding:2px 8px;border-radius:6px;flex:0 0 auto;margin-top:1px}
.ltxt{flex:1;min-width:0}
.ltxt .t{font-size:15px;font-weight:600;line-height:1.4}
.soon{font-size:11px;color:#c99a6a;background:#1d1712;border:1px solid #584029;padding:2px 7px;border-radius:5px;margin-left:6px}

.sect{display:flex;align-items:center;gap:8px;margin:2px 0 9px}
.sect b{font-size:14px;font-weight:700;letter-spacing:.02em;color:#cdc5bd}
.sect .hic svg{width:18px;height:18px;stroke:#b18268}

/* ---------- прогрес ---------- */
.prog{background:#151312;border:1px solid #292420;border-radius:14px;padding:15px 18px;margin-bottom:16px}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.prow{display:flex;justify-content:space-between;font-size:13px;color:#8d857d;margin-bottom:8px}
.prow b{color:#b18268;font-size:15px}
.pbar{height:6px;background:#221e1a;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b18268,#d0a086);transition:width .4s}

/* ---------- інструменти ---------- */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tool{background:#151312;border:1px solid #292420;border-radius:12px;padding:15px}
.tool b{display:block;font-size:14.5px;margin-bottom:4px}
.tool span{font-size:12.5px;color:#8d857d;line-height:1.5;display:block}
.tool.dis{opacity:.45}

.hwc{display:flex;gap:13px;align-items:flex-start;background:#151312;border:1px solid #292420;
     border-radius:12px;padding:15px 17px;margin-bottom:9px;transition:border-color .15s,opacity .2s}
.hwc:hover{border-color:#3d352e}
.hwc.on{border-color:#2c4a35;opacity:.72}
.hwc .chk{flex:0 0 21px;height:21px;border-radius:6px;border:2px solid #45454f;margin-top:2px;
          position:relative;cursor:pointer;transition:.15s}
.hwc .chk:hover{border-color:#6f675f}
.hwc.on .chk{background:#5aa96f;border-color:#5aa96f}
.hwc.on .chk::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
                    border:solid #0b0b0b;border-width:0 2px 2px 0;transform:rotate(42deg)}
.hwt{flex:1;min-width:0}
.hwt a{font-size:15px;font-weight:700;display:block;line-height:1.35}
.hwt span{font-size:12.5px;color:#8d857d;display:block;margin-top:4px;line-height:1.5}
.hwb{flex:0 0 auto;align-self:center;font-size:11px;padding:3px 9px;border-radius:6px;
     background:#121b15;border:1px solid #2c4a35;color:#8fd0a4;white-space:nowrap}
.hwb.wait{background:#1d1712;border-color:#584029;color:#c99a6a}
@media(max-width:560px){.hwb{display:none}}
.sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6f675f;margin:16px 0 8px;font-weight:700}
.foot{font-size:12.5px;color:#6f675f;text-align:center;margin-top:26px;line-height:1.7}
@media(max-width:560px){
  body{padding:16px 12px 80px}
  h1{font-size:22px}
  .les{padding:12px 13px}
}
</style>
</head>

function search(qs){
  var q=toks(qs); if(!q.length)return [];
  var terms=[]; q.forEach(function(t){ expand(t).forEach(function(x){ if(terms.indexOf(x)<0) terms.push(x) }) });
  var tstem=terms.map(stem);

  var all=L.map(function(x){return{kind:"les",o:x,txt:(x.t+" "+(x.k||"")+" "+(x.g||[]).map(function(g){return g[0]}).join(" ")).toLowerCase()}})
    .concat(TOOLS.map(function(x){return{kind:"tool",o:x,txt:(x.t+" "+x.d+" "+(x.k||"")).toLowerCase()}}))
    .concat(DOCS.map(function(x){return{kind:"doc",o:x,txt:(x.t+" "+x.d+" "+(x.k||"")).toLowerCase()}}))
    .concat([{kind:"nav",o:{t:"Корисні канали по PPC",d:"Telegram-канали і YouTube, які варто читати",v:"chan"},
              txt:"канали чати телеграм telegram youtube ютуб блоги підписки читати ppc спільнота"},
             {kind:"nav",o:{t:"Домашні завдання",d:"Капстоун Модуля 05",v:"hw"},
              txt:"дз домашка домашнє завдання капстоун здати практика"},
             {kind:"nav",o:{t:"Мої робочі документи",d:"Медіаплан, стратегія масштабування, кросканальна стратегія — приклади форми",v:"docs"},
              txt:"медіаплан медиаплан план бюджету приклад документа шаблон клієнту комерційна пропозиція стратегія масштабування розрахунок"}]);

  var hits=[];
  all.forEach(function(e){
    var title=(e.kind==="les"?e.o.t:e.o.t).toLowerCase();
    var tt=toks(e.txt).map(stem), ttl=toks(title).map(stem);
    var sc=0, matched={};
    tstem.forEach(function(s,i){
      if(ttl.indexOf(s)>=0){ sc+=6; matched[terms[i]]=1; return }
      if(tt.indexOf(s)>=0){ sc+=4; matched[terms[i]]=1; return }
      if(s.length>=5){
        for(var k=0;k<tt.length;k++){ if(lev(s,tt[k])<=1){ sc+=2; matched[terms[i]]=1; return } }
      }
    });
    if(e.txt.indexOf(qs.toLowerCase().trim())>=0) sc+=10;
    var uniq=Object.keys(matched).length;
    if(uniq>=q.length) sc=Math.round(sc*1.6);
    if(sc>0) hits.push({e:e,sc:sc,m:Object.keys(matched)});
  });
  hits.sort(function(a,b){return b.sc-a.sc});
  /* відсікаємо шум: лишаємо тільки те, що близьке до найкращого збігу */
  if(hits.length){
    var top=hits[0].sc;
    hits=hits.filter(function(x){return x.sc>=Math.max(6,top*0.45)});
  }
  return hits.slice(0,5);
}

function chips(x){
  var h='<div class="links">';
  if(x.v&&x.v2){
    h+='<a class="lk lk-v" href="'+YT+x.v+'" target="_blank" rel="noopener">▶ Частина 1</a>'+
       '<a class="lk lk-v" href="'+YT+x.v2+'" target="_blank" rel="noopener">▶ Частина 2</a>';
  }
  else if(x.v) h+='<a class="lk lk-v" href="'+YT+x.v+'" target="_blank" rel="noopener">▶ Відео</a>';
  else if(x.soon) h+='<span class="miss">▶ Відео скоро</span>';
  /* g = [назва, id-сторінки Notion АБО повний URL, необовʼязкова іконка] */
  (x.g||[]).forEach(function(g){
    var u=/^https?:\/\//.test(g[1])?g[1]:NO+g[1];
    h+='<a class="lk lk-g" href="'+u+'" target="_blank" rel="noopener">'+(g[2]||"📕")+' '+esc(g[0])+'</a>';
  });
  if(x.p) h+='<a class="lk lk-p" href="'+DR+x.p+'/view" target="_blank" rel="noopener">📗 Конспект</a>';
  TOOLS.forEach(function(t){ if(t.les&&t.les.indexOf(x.n)>=0) h+='<a class="lk lk-t" href="'+t.u+'" target="_blank" rel="noopener">'+esc(t.t)+'</a>' });
  return h+'</div>';
}

function progress(){
  var av=L.filter(function(x){return !x.soon});
  var tot=av.length, s=0;
  av.forEach(function(x){ if(seen[x.n]) s++ });
  $("pSeen").textContent=s; $("pAll").textContent=tot;
  $("pFill").style.width=Math.min(100,s/tot*100)+"%";
  $("pTitle").textContent=(s>=tot)?"Ти пройшов усі уроки":"Переглянуто уроків";
}

    var full=ls.length&&sn===ls.length;
    h+='<div class="fold'+(full?" full":"")+'" data-open="'+m.n+'">'+
       (full?'<img class="win" src="'+HERO_WIN+'" alt="">':'')+

     '<div class="cnt">'+TOOLS.length+' інструменти — калькулятори, чек-листи, конструктор</div></div>';

function renderModule(n){
  var m=MODS.filter(function(z){return z.n===n})[0];
  var all=L.filter(function(x){return x.m===n});
  var ls=all.filter(function(x){return !x.soon});
  var sn=ls.filter(function(x){return seen[x.n]}).length;
  var h='<button class="back" data-open="home">← Усі модулі</button>'+
        '<div class="mod"><div class="mhd"><b><span class="hic">'+ICONS[n]+'</span> Модуль 0'+n+' — '+esc(m.t)+'</b>'+
        '<span class="c">'+sn+' / '+ls.length+'</span></div>';
  all.forEach(function(x){
    h+='<div class="les'+(seen[x.n]?" seen":"")+(x.soon?" wait":"")+'"><div class="lhd">'+
       (x.soon?'<div class="chk off"></div>':'<div class="chk" data-seen="'+x.n+'"></div>')+
       '<div class="lnum">'+esc(x.n)+'</div>'+
       '<div class="ltxt"><div class="t">'+esc(x.t)+(x.soon?'<span class="soon">скоро</span>':'')+'</div>'+chips(x)+'</div>'+
       '</div></div>';
  });
  h+='</div>';
  if(ls.length&&sn===ls.length){
    h+='<div class="modone"><img src="'+HERO_WIN+'" alt="">'+
       '<div><b>Модуль закрито</b><span>Усі '+ls.length+' уроків переглянуто — можна рухатись далі</span></div></div>';
  }
  $("body").innerHTML=h;
}

  else renderModule(view);

  $("hints").innerHTML=HINTS.map(function(x){return '<div class="hint" data-h="'+esc(x)+'">'+esc(x)+'</div>'}).join("");
}

function doSearch(){
  var v=$("q").value.trim();
  $("clr").classList.toggle("on",!!v);
  if(v.length<2){ $("res").classList.add("off"); $("main").style.display=""; return }
  var hits=search(v);
  $("main").style.display="none";
  $("res").classList.remove("off");
  if(!hits.length){
    $("res").innerHTML='<div class="nores">Нічого не знайшов за запитом «'+esc(v)+'».<br><br>'+
      'Спробуй іншими словами — або постав питання в чат, і я додам це в каталог.</div>';
    return;
  }
  var h='<div class="rcount">Знайдено: '+hits.length+'</div>';
  hits.forEach(function(x){
    var o=x.e.o;
    if(x.e.kind==="les"){
      var m=MODS.filter(function(z){return z.n===o.m})[0];
      h+='<div class="hit"><div class="top"><span class="num">'+esc(o.n)+'</span>'+
         '<span class="ttl">'+esc(o.t)+'</span><span class="mod">Модуль 0'+o.m+'</span></div>'+
         chips(o)+'</div>';
    } else if(x.e.kind==="nav"){
      h+='<div class="hit"><div class="top"><span class="ttl">'+esc(o.t)+'</span><span class="mod">розділ</span></div>'+
         '<div class="why">'+esc(o.d)+'</div>'+
         '<div class="links"><button class="lk lk-t" data-open="'+o.v+'">Відкрити →</button></div></div>';
    } else {
      h+='<div class="hit"><div class="top"><span class="ttl">'+esc(o.t)+'</span><span class="mod">'+
         (x.e.kind==="doc"?"документ":"інструмент")+'</span></div>'+
         '<div class="why">'+esc(o.d)+'</div>'+
         '<div class="links"><a class="lk lk-t" href="'+o.u+'" target="_blank" rel="noopener">Відкрити →</a></div></div>';
    }
  });
  $("res").innerHTML=h;
}

document.addEventListener("click",function(e){
  var op=e.target.closest("[data-open]");
  if(op){
    var v=op.getAttribute("data-open");
    view=(v==="home")?null:((v==="tools"||v==="hw"||v==="chan")?v:+v);
    if($("q").value){ $("q").value=""; doSearch() }
    renderCat(); window.scrollTo({top:0,behavior:"smooth"}); return;
  }
  var hw=e.target.closest("[data-hw]");
  if(hw){ var id=hw.getAttribute("data-hw"); if(hwDone[id])delete hwDone[id];else hwDone[id]=1; saveHw(); renderCat(); return }
  var s=e.target.closest("[data-seen]");
  if(s){ var n=s.getAttribute("data-seen"); if(seen[n])delete seen[n];else seen[n]=1; save(); renderCat(); return }
  var hn=e.target.closest("[data-h]");
  if(hn){ $("q").value=hn.getAttribute("data-h"); doSearch(); window.scrollTo({top:0,behavior:"smooth"}); return }
  if(e.target.closest("#clr")){ $("q").value=""; doSearch(); $("q").focus(); return }
  if(e.target.closest("#reset")){ if(confirm("Скинути всі позначки — і переглянуті уроки, і здані ДЗ?")){ seen={}; hwDone={}; save(); saveHw(); renderCat() } return }
});
$("q").addEventListener("input",function(){ clearTimeout(window._s); window._s=setTimeout(doSearch,180) });
